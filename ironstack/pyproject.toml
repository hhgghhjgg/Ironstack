# pyproject.toml - Modern Python project configuration for IronStack

[build-system]
requires = [
    "setuptools>=68.0",
    "wheel>=0.41.0",
    "setuptools-scm>=8.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "ironstack"
version = "0.1.0"
description = "IronStack - Security Swiss Army Knife: WAF, Code Protection, Anti-Cheat, Red Team tools in one package"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
maintainers = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = [
    "security",
    "waf",
    "firewall",
    "code-protection",
    "obfuscation",
    "anti-cheat",
    "penetration-testing",
    "red-team",
    "blue-team",
    "python",
    "coraza",
    "pyarmor",
    "frida",
    "capstone",
    "unicorn",
    "sqlmap",
    "nmap",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
# Defense layer - Blue Team tools
defense = [
    "pyarmor>=8.0.0",
    "pycryptodome>=3.18.0",
    "cryptography>=41.0.0",
]

# Attack layer - Red Team tools
attack = [
    "frida-tools>=12.0.0",
    "frida>=16.0.0",
    "capstone>=5.0.0",
    "unicorn>=2.0.1",
    "python-nmap>=0.7.1",
    "sqlmap>=1.7.0",
    "scapy>=2.5.0",
    "pwntools>=4.11.0",
]

# Anti-cheat layer - Gaming security
anticheat = [
    # Additional anti-cheat dependencies
]

# Full installation (everything)
full = [
    "ironstack[defense]",
    "ironstack[attack]",
    "ironstack[anticheat]",
]

# Development and testing dependencies
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "tox>=4.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "coverage>=7.4.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
]

# Documentation dependencies
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=3.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/your-username/ironstack"
Documentation = "https://ironstack.readthedocs.io"
Repository = "https://github.com/your-username/ironstack"
Issues = "https://github.com/your-username/ironstack/issues"
Changelog = "https://github.com/your-username/ironstack/blob/main/CHANGELOG.md"

[project.scripts]
ironstack = "ironstack.cli:main"

[project.gui-scripts]
# ironstack-gui = "ironstack.gui:main"

[tool.setuptools]
packages = [
    "ironstack",
    "ironstack.defense",
    "ironstack.defense.anti_cheat",
    "ironstack.attack",
    "ironstack.utils",
]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
ironstack = [
    "*.yaml",
    "*.yml",
    "*.json",
    "*.conf",
    "*.rules",
    "py.typed",
]

# ==========================================
# Tool Configurations
# ==========================================

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ironstack"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "docs/conf.py",
    "build",
    "dist",
    "*.egg-info",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = [
    "tests/",
    "docs/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short --strict-markers --disable-warnings"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "defense: tests for defense layer",
    "attack: tests for attack layer",
    "anticheat: tests for anti-cheat layer",
    "waf: tests for WAF module",
    "protector: tests for code protection module",
    "scanner: tests for scanner module",
]

[tool.coverage.run]
source = ["ironstack"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\bProtocol\\):",
]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101", "B601"]  # Skip assert and shell injection checks

[tool.pylint]
max-line-length = 100
disable = [
    "C0111",  # missing-docstring
    "R0903",  # too-few-public-methods
]
ignore-patterns = ["tests/*", "docs/*"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"

[tool.poetry]  # Alternative if switching to Poetry later
packages = [
    {include = "ironstack"},
]
