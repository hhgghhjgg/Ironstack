# .github/workflows/ironstack-benchmark.yml
# ============================================
# IronStack FULL Benchmark – All-in-One
# Saves EVERYTHING in ONE file: benchmark_results/benchmark_report.json
# Works whether jobs PASS or FAIL
# ============================================

name: 🛡️ IronStack Full Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: "📊 Complete Benchmark"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Create results directory
        run: mkdir -p benchmark_results

      # ================================================================
      # STEP 1: Full system info log
      # ================================================================
      - name: System info
        run: |
          echo "=== SYSTEM INFO ===" > benchmark_results/full_log.txt
          echo "Timestamp: $(date -u)" >> benchmark_results/full_log.txt
          echo "Commit: ${{ github.sha }}" >> benchmark_results/full_log.txt
          echo "Branch: ${{ github.ref_name }}" >> benchmark_results/full_log.txt
          echo "Run ID: ${{ github.run_id }}" >> benchmark_results/full_log.txt
          echo "Python: $(python3 --version)" >> benchmark_results/full_log.txt
          echo "Pip: $(pip --version)" >> benchmark_results/full_log.txt
          echo "" >> benchmark_results/full_log.txt

      # ================================================================
      # STEP 2: Project structure check
      # ================================================================
      - name: Check project structure
        run: |
          echo "=== PROJECT STRUCTURE ===" >> benchmark_results/full_log.txt
          echo "Working directory: $(pwd)" >> benchmark_results/full_log.txt
          echo "" >> benchmark_results/full_log.txt
          echo "Root files:" >> benchmark_results/full_log.txt
          ls -la *.py *.cfg *.toml *.txt *.md Makefile 2>/dev/null >> benchmark_results/full_log.txt || echo "  (some missing)" >> benchmark_results/full_log.txt
          echo "" >> benchmark_results/full_log.txt
          echo "Package directory:" >> benchmark_results/full_log.txt
          find ironstack -type f -name "*.py" 2>/dev/null | sort >> benchmark_results/full_log.txt || echo "  ironstack/ NOT FOUND" >> benchmark_results/full_log.txt
          echo "" >> benchmark_results/full_log.txt
          echo "Test directory:" >> benchmark_results/full_log.txt
          find tests -type f -name "*.py" 2>/dev/null | sort >> benchmark_results/full_log.txt || echo "  tests/ NOT FOUND" >> benchmark_results/full_log.txt

      # ================================================================
      # STEP 3: Install IronStack (NEVER stop on error)
      # ================================================================
      - name: Install IronStack
        run: |
          echo "" >> benchmark_results/full_log.txt
          echo "=== INSTALLATION ===" >> benchmark_results/full_log.txt
          set +e
          pip install -e ".[defense]" 2>&1 | tee -a benchmark_results/full_log.txt
          INSTALL_EXIT=$?
          set -e
          echo "Install exit code: $INSTALL_EXIT" >> benchmark_results/full_log.txt
          if [ $INSTALL_EXIT -ne 0 ]; then
            echo "❌ INSTALLATION FAILED" >> benchmark_results/full_log.txt
          else
            echo "✅ Installation successful" >> benchmark_results/full_log.txt
          fi
        continue-on-error: true

      # ================================================================
      # STEP 4: WAF Benchmark
      # ================================================================
      - name: WAF Benchmark
        run: |
          echo "" >> benchmark_results/full_log.txt
          echo "=== WAF BENCHMARK ===" >> benchmark_results/full_log.txt
          set +e
          python3 -c "
          import json, time, sys, traceback, os
          
          results = {
              'import_ok': False,
              'import_error': '',
              'traceback': '',
              'sys_path': sys.path,
              'cwd': os.getcwd(),
          }
          
          try:
              from ironstack.defense import WAF
              waf = WAF(engine='python', mode='normal')
              results['import_ok'] = True
          except Exception as e:
              results['import_error'] = str(e)
              results['traceback'] = traceback.format_exc()
          
          if results.get('import_ok'):
              test_cases = {
                  'sql_injection': [\"' OR '1'='1 --\",\"' UNION SELECT NULL--\",\"admin'--\",\"1; DROP TABLE users--\",\"' OR 1=1#\",\"1' ORDER BY 1--\"],
                  'xss': ['<script>alert(1)</script>','<img src=x onerror=alert(1)>','javascript:alert(1)','<svg onload=alert(1)>','<body onload=alert(1)>','<iframe src=javascript:alert(1)>'],
                  'path_traversal': ['../../../etc/passwd','..\\\\\\\\..\\\\\\\\..\\\\\\\\windows\\\\\\\\win.ini','%2e%2e%2f%2e%2e%2fetc%2fpasswd'],
                  'command_injection': ['127.0.0.1; cat /etc/passwd','127.0.0.1 | ls -la','\$(whoami)','\`id\`'],
              }
              
              for category, payloads in test_cases.items():
                  r = {'total':len(payloads),'blocked':0,'missed':[]}
                  for p in payloads:
                      resp = waf.check_request({
                          'method':'POST','path':'/test','headers':{},
                          'body':f'input={p}','query_params':{},'ip':'10.0.0.100'
                      })
                      if not resp['allowed']:
                          r['blocked'] += 1
                      else:
                          r['missed'].append(p)
                  r['detection_rate'] = round(r['blocked']/len(payloads)*100,2) if payloads else 0
                  results[category] = r
              
              # Scanner detection
              scanners = ['sqlmap/1.6#stable','Nikto/2.1.6','Nessus','Burp Suite Professional','Acunetix-Deepscan']
              r = {'total':len(scanners),'blocked':0,'missed':[]}
              for ua in scanners:
                  resp = waf.check_request({
                      'method':'GET','path':'/','headers':{'User-Agent':ua},
                      'body':'','query_params':{},'ip':'10.0.0.200'
                  })
                  if not resp['allowed']:
                      r['blocked'] += 1
                  else:
                      r['missed'].append(ua)
              r['detection_rate'] = round(r['blocked']/len(scanners)*100,2) if scanners else 0
              results['scanner_detection'] = r
              
              # False positives
              normal_reqs = [
                  {'m':'GET','p':'/home','b':''},
                  {'m':'GET','p':'/about','b':''},
                  {'m':'POST','p':'/login','b':'user=john&pass=secret123'},
                  {'m':'GET','p':'/api/v1/users?id=42','b':''},
                  {'m':'GET','p':'/products','b':''},
              ]
              r = {'total':len(normal_reqs),'blocked':0}
              for n in normal_reqs:
                  resp = waf.check_request({
                      'method':n['m'],'path':n['p'],'headers':{},
                      'body':n.get('b',''),'query_params':{},'ip':'192.168.1.50'
                  })
                  if not resp['allowed']:
                      r['blocked'] += 1
              r['fp_rate'] = round(r['blocked']/len(normal_reqs)*100,2) if normal_reqs else 0
              results['false_positives'] = r
              
              # Performance
              start = time.perf_counter()
              for i in range(100):
                  waf.check_request({
                      'method':'GET','path':'/test','headers':{},
                      'body':'','query_params':{},'ip':f'192.168.1.{i%255}'
                  })
              elapsed = time.perf_counter() - start
              results['performance'] = {
                  'total_requests':100,
                  'elapsed_seconds':round(elapsed,3),
                  'requests_per_second':round(100/elapsed,2) if elapsed > 0 else 0,
                  'average_latency_ms':round(elapsed/100*1000,2) if elapsed > 0 else 0
              }
              
              # Overall
              detection_keys = ['sql_injection','xss','path_traversal','command_injection','scanner_detection']
              rates = [results[k]['detection_rate'] for k in detection_keys if k in results]
              if rates:
                  avg_detection = round(sum(rates)/len(rates),2)
                  fp = results.get('false_positives',{}).get('fp_rate',0)
                  rps = results.get('performance',{}).get('requests_per_second',0)
                  grade = 'A' if avg_detection >= 95 else 'B' if avg_detection >= 85 else 'C' if avg_detection >= 70 else 'D'
                  results['overall'] = {
                      'average_detection_rate': avg_detection,
                      'false_positive_rate': fp,
                      'requests_per_second': rps,
                      'grade': grade
                  }
          
          results['timestamp'] = time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())
          results['python_version'] = sys.version
          
          with open('benchmark_results/waf_results.json','w') as f:
              json.dump(results, f, indent=2, default=str)
          
          print('WAF Results:', json.dumps(results.get('overall', {}), indent=2))
          " 2>&1 | tee -a benchmark_results/full_log.txt
          WAF_EXIT=$?
          echo "WAF exit code: $WAF_EXIT" >> benchmark_results/full_log.txt
        continue-on-error: true

      # ================================================================
      # STEP 5: Unit Tests
      # ================================================================
      - name: Unit Tests
        run: |
          echo "" >> benchmark_results/full_log.txt
          echo "=== UNIT TESTS ===" >> benchmark_results/full_log.txt
          set +e
          pip install pytest pytest-cov 2>&1 | tee -a benchmark_results/full_log.txt
          pytest tests/ -v --tb=short --cov=ironstack --cov-report=json \
            --ignore=tests/test_attack/test_hooker.py \
            --ignore=tests/test_attack/test_disassembler.py \
            --ignore=tests/test_attack/test_emulator.py \
            -m "not integration" 2>&1 | tee -a benchmark_results/full_log.txt
          TEST_EXIT=$?
          set -e
          echo "Test exit code: $TEST_EXIT" >> benchmark_results/full_log.txt
        continue-on-error: true

      - name: Parse test results
        run: |
          echo "" >> benchmark_results/full_log.txt
          echo "=== TEST PARSING ===" >> benchmark_results/full_log.txt
          set +e
          python3 -c "
          import json, re
          from pathlib import Path

          result = {'passed':0,'failed':0,'errors':0,'coverage':0,'total':0}

          cov_file = Path('coverage.json')
          if cov_file.exists():
              with open(cov_file) as f:
                  cov = json.load(f)
                  result['coverage'] = round(cov.get('totals',{}).get('percent_covered',0),2)

          log_file = Path('benchmark_results/full_log.txt')
          if log_file.exists():
              text = log_file.read_text()
              m = re.search(r'(\d+) passed', text)
              if m: result['passed'] = int(m.group(1))
              m = re.search(r'(\d+) failed', text)
              if m: result['failed'] = int(m.group(1))
              m = re.search(r'(\d+) errors', text)
              if m: result['errors'] = int(m.group(1))

          result['total'] = result['passed'] + result['failed'] + result['errors']

          import time
          result['timestamp'] = time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())

          with open('benchmark_results/unit_results.json','w') as f:
              json.dump(result, f, indent=2)

          print(f\"Tests: {result['passed']}/{result['total']} passed | Coverage: {result['coverage']}%\")
          " 2>&1 | tee -a benchmark_results/full_log.txt
        continue-on-error: true

      # ================================================================
      # STEP 6: Combine everything into ONE SINGLE FILE
      # ================================================================
      - name: Combine final report
        if: always()
        run: |
          echo "" >> benchmark_results/full_log.txt
          echo "=== FINAL REPORT ===" >> benchmark_results/full_log.txt
          set +e
          python3 -c "
          import json
          from pathlib import Path
          from datetime import datetime

          final = {
              'timestamp': datetime.utcnow().isoformat(),
              'commit': '${{ github.sha }}',
              'branch': '${{ github.ref_name }}',
              'run_id': '${{ github.run_id }}',
              'run_url': '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              'full_log': '',
              'waf_results': {},
              'unit_test_results': {},
              'overall_status': 'UNKNOWN'
          }

          # Load full log
          log_path = Path('benchmark_results/full_log.txt')
          if log_path.exists():
              final['full_log'] = log_path.read_text()

          # Load WAF results
          waf_path = Path('benchmark_results/waf_results.json')
          if waf_path.exists():
              with open(waf_path) as f:
                  final['waf_results'] = json.load(f)

          # Load unit test results
          test_path = Path('benchmark_results/unit_results.json')
          if test_path.exists():
              with open(test_path) as f:
                  final['unit_test_results'] = json.load(f)

          # Determine overall status
          waf_ok = final['waf_results'].get('overall',{}).get('grade') in ('A','B')
          tests_ok = final['unit_test_results'].get('failed',0) == 0 and final['unit_test_results'].get('total',0) > 0
          has_waf = bool(final['waf_results'].get('overall'))
          has_tests = bool(final['unit_test_results'].get('total',0) > 0)

          if has_waf and has_tests:
              final['overall_status'] = 'PASS' if (waf_ok and tests_ok) else 'FAIL'
          elif has_waf and not has_tests:
              final['overall_status'] = 'PASS' if waf_ok else 'FAIL'
          else:
              final['overall_status'] = 'FAIL'

          # Write the ONE AND ONLY report file
          with open('benchmark_results/benchmark_report.json','w') as f:
              json.dump(final, f, indent=2, default=str)

          print('Overall status:', final['overall_status'])
          " 2>&1 | tee -a benchmark_results/full_log.txt

      # ================================================================
      # STEP 7: Save report to main branch (ALWAYS - even on failure)
      # ================================================================
      - name: Save report to main branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only add the final report
          git add benchmark_results/benchmark_report.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Update benchmark report [skip ci]" || echo "Commit failed"
            git push origin main || echo "Push failed (may be PR)"
          fi

      # ================================================================
      # STEP 8: Comment on PR
      # ================================================================
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'benchmark_results/benchmark_report.json';
            if (!fs.existsSync(path)) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## ⚠️ Benchmark failed\n\nNo report generated. Check [workflow logs](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ').'
              });
              return;
            }
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            const w = r.waf_results?.overall || {};
            const t = r.unit_test_results || {};
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🛡️ IronStack Benchmark Results\n\n| Metric | Value |\n|--------|-------|\n| WAF Detection Rate | ${w.average_detection_rate||'N/A'}% |\n| WAF Grade | ${w.grade||'N/A'} |\n| False Positive Rate | ${w.false_positive_rate||'N/A'}% |\n| Performance | ${w.requests_per_second||'N/A'} req/s |\n| Unit Tests | ${t.passed||0}/${t.total||0} passed |\n| Code Coverage | ${t.coverage||0}% |\n| **Overall Status** | **${r.overall_status}** |\n\n[📄 Full Report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/main/benchmark_results/benchmark_report.json)`
            });