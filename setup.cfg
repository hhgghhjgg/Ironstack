# setup.cfg - Configuration for IronStack package

[metadata]
name = ironstack
version = attr: ironstack.__version__
description = IronStack - Security Swiss Army Knife
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/your-username/ironstack
author = Your Name
author_email = your.email@example.com
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Intended Audience :: System Administrators
    Intended Audience :: Information Technology
    Topic :: Security
    Topic :: Software Development :: Libraries :: Python Modules
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
include_package_data = True
zip_safe = False
install_requires =
    requests>=2.28.0
    pyyaml>=6.0
    colorama>=0.4.6
    rich>=13.0.0
    click>=8.1.0

[options.extras_require]
defense =
    pyarmor>=8.0.0
    pycryptodome>=3.18.0
    cryptography>=41.0.0
    docker>=7.0.0
attack =
    frida-tools>=12.0.0
    frida>=16.0.0
    capstone>=5.0.0
    unicorn>=2.0.1
    python-nmap>=0.7.1
    sqlmap>=1.7.0
    scapy>=2.5.0
    pwntools>=4.11.0
full =
    %(defense)s
    %(attack)s
dev =
    pytest>=8.0.0
    pytest-cov>=4.1.0
    pytest-mock>=3.12.0
    black>=24.0.0
    flake8>=7.0.0
    mypy>=1.8.0
    pre-commit>=3.6.0
    tox>=4.0.0
    build>=1.0.0
    twine>=5.0.0
    sphinx>=7.0.0
    sphinx-rtd-theme>=2.0.0

[options.entry_points]
console_scripts =
    ironstack = ironstack.cli:main

[options.packages.find]
include = ironstack, ironstack.*