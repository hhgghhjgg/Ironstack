# .github/workflows/ironstack-benchmark.yml
# ============================================
# IronStack Benchmark – All-in-One
# Runs benchmarks, logs everything, and saves
# a SINGLE result file to main branch.
# ============================================

name: 🛡️ IronStack Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: "📊 Full Benchmark & Log"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Setup Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Create directory for final results
      - name: Prepare results folder
        run: mkdir -p benchmark_results

      # 4. Structure check (log only, no destructive changes)
      - name: Check project structure
        id: structure
        run: |
          echo "=== PROJECT STRUCTURE CHECK ===" > benchmark_results/structure_check.txt
          # Root files that must exist
          for f in setup.py setup.cfg pyproject.toml requirements.txt requirements-dev.txt Makefile README.md; do
            if [ -f "$f" ]; then
              echo "✅ $f exists" >> benchmark_results/structure_check.txt
            else
              echo "❌ $f MISSING" >> benchmark_results/structure_check.txt
            fi
          done
          # Package dirs
          for d in ironstack ironstack/defense ironstack/defense/anti_cheat ironstack/attack ironstack/utils tests tests/test_defense tests/test_attack examples docs scripts .github .github/workflows; do
            if [ -d "$d" ]; then
              echo "✅ $d/ exists" >> benchmark_results/structure_check.txt
            else
              echo "❌ $d/ MISSING" >> benchmark_results/structure_check.txt
            fi
          done
          # Init files
          for f in ironstack/__init__.py ironstack/defense/__init__.py ironstack/defense/anti_cheat/__init__.py ironstack/attack/__init__.py ironstack/utils/__init__.py tests/__init__.py tests/test_defense/__init__.py tests/test_attack/__init__.py; do
            if [ -f "$f" ]; then
              if [ -s "$f" ]; then
                echo "✅ $f exists (non‑empty)" >> benchmark_results/structure_check.txt
              else
                echo "⚠️ $f exists but is EMPTY" >> benchmark_results/structure_check.txt
              fi
            else
              echo "❌ $f MISSING" >> benchmark_results/structure_check.txt
            fi
          done

      # 5. Install IronStack
      - name: Install IronStack
        run: |
          echo "=== INSTALL LOG ===" > benchmark_results/install_log.txt
          pip install -e ".[defense,full]" 2>&1 | tee -a benchmark_results/install_log.txt || true

      # 6. Run WAF benchmark (capture everything)
      - name: WAF Benchmark
        run: |
          echo "=== WAF BENCHMARK ===" > benchmark_results/waf_full.log
          python -c "
          import json, time, sys, traceback, os
          results = {'errors':[], 'warnings':[], 'raw_log':''}
          try:
              from ironstack.defense import WAF
              waf = WAF(engine='python', mode='normal')
              results['import_ok'] = True
          except Exception as e:
              results['import_ok'] = False
              results['import_error'] = str(e)
              results['traceback'] = traceback.format_exc()
              results['sys_path'] = sys.path
              results['cwd'] = os.getcwd()
              results['files_in_cwd'] = os.listdir('.')
              if os.path.exists('ironstack'):
                  results['files_in_ironstack'] = os.listdir('ironstack')

          if results.get('import_ok'):
              # SQLi
              try:
                  sql = [\"' OR '1'='1 --\",\"' UNION SELECT NULL--\",\"admin'--\",\"1; DROP TABLE users--\",\"' OR 1=1#\",\"1' ORDER BY 1--\"]
                  r = {'total':len(sql),'blocked':0}
                  for p in sql:
                      resp = waf.check_request({'method':'POST','path':'/login','headers':{},'body':f'user={p}','query_params':{},'ip':'10.0.0.100'})
                      if not resp['allowed']: r['blocked']+=1
                  r['detection_rate'] = round(r['blocked']/len(sql)*100,2)
                  results['sql_injection'] = r
              except Exception as e:
                  results['errors'].append(f'SQLi: {e}')
              # XSS
              try:
                  xss = ['<script>alert(1)</script>','<img src=x onerror=alert(1)>','javascript:alert(1)','<svg onload=alert(1)>','<body onload=alert(1)>','<iframe src=javascript:alert(1)>']
                  r = {'total':len(xss),'blocked':0}
                  for p in xss:
                      resp = waf.check_request({'method':'POST','path':'/comment','headers':{},'body':f'c={p}','query_params':{},'ip':'10.0.0.101'})
                      if not resp['allowed']: r['blocked']+=1
                  r['detection_rate'] = round(r['blocked']/len(xss)*100,2)
                  results['xss'] = r
              except Exception as e:
                  results['errors'].append(f'XSS: {e}')
              # Path Traversal
              try:
                  pt = ['../../../etc/passwd','..\\\\..\\\\..\\\\windows\\\\win.ini','%2e%2e%2f%2e%2e%2fetc%2fpasswd']
                  r = {'total':len(pt),'blocked':0}
                  for p in pt:
                      resp = waf.check_request({'method':'GET','path':'/dl','headers':{},'body':'','query_params':{'f':p},'ip':'10.0.0.102'})
                      if not resp['allowed']: r['blocked']+=1
                  r['detection_rate'] = round(r['blocked']/len(pt)*100,2)
                  results['path_traversal'] = r
              except Exception as e:
                  results['errors'].append(f'PathTraversal: {e}')
              # Command Injection
              try:
                  cmd = ['127.0.0.1; cat /etc/passwd','127.0.0.1 | ls -la','\$(whoami)','\`id\`']
                  r = {'total':len(cmd),'blocked':0}
                  for p in cmd:
                      resp = waf.check_request({'method':'GET','path':'/ping','headers':{},'body':'','query_params':{'h':p},'ip':'10.0.0.103'})
                      if not resp['allowed']: r['blocked']+=1
                  r['detection_rate'] = round(r['blocked']/len(cmd)*100,2)
                  results['command_injection'] = r
              except Exception as e:
                  results['errors'].append(f'CMDi: {e}')
              # Scanner detection
              try:
                  uas = ['sqlmap/1.6#stable','Nikto/2.1.6','Nessus','Burp Suite Professional','Acunetix-Deepscan']
                  r = {'total':len(uas),'blocked':0}
                  for u in uas:
                      resp = waf.check_request({'method':'GET','path':'/','headers':{'User-Agent':u},'body':'','query_params':{},'ip':'10.0.0.104'})
                      if not resp['allowed']: r['blocked']+=1
                  r['detection_rate'] = round(r['blocked']/len(uas)*100,2)
                  results['scanner_detection'] = r
              except Exception as e:
                  results['errors'].append(f'Scanner: {e}')
              # False Positives
              try:
                  normal = [{'m':'GET','p':'/home'},{'m':'POST','p':'/login','b':'user=john&pass=secret'}]
                  r = {'total':len(normal),'blocked':0}
                  for n in normal:
                      resp = waf.check_request({'method':n['m'],'path':n['p'],'headers':{},'body':n.get('b',''),'query_params':{},'ip':'192.168.1.50'})
                      if not resp['allowed']: r['blocked']+=1
                  r['fp_rate'] = round(r['blocked']/len(normal)*100,2)
                  results['false_positives'] = r
              except Exception as e:
                  results['errors'].append(f'FP: {e}')
              # Performance
              try:
                  start = time.perf_counter()
                  for i in range(100):
                      waf.check_request({'method':'GET','path':'/t','headers':{},'body':'','query_params':{'p':'v'},'ip':f'192.168.1.{i%255}'})
                  elapsed = time.perf_counter()-start
                  results['performance'] = {'requests':100,'elapsed':round(elapsed,3),'rps':round(100/elapsed,2),'avg_latency_ms':round(elapsed/100*1000,2)}
              except Exception as e:
                  results['errors'].append(f'Perf: {e}')
              # Overall
              keys = ['sql_injection','xss','path_traversal','command_injection','scanner_detection']
              rates = [results[k]['detection_rate'] for k in keys if k in results]
              if rates:
                  avg = round(sum(rates)/len(rates),2)
                  fp = results.get('false_positives',{}).get('fp_rate',0)
                  rps = results.get('performance',{}).get('rps',0)
                  results['overall'] = {'detection_rate':avg,'fp_rate':fp,'rps':rps,'grade':'A' if avg>=95 else 'B' if avg>=85 else 'C' if avg>=70 else 'D'}
          results['python'] = sys.version
          results['timestamp'] = time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())
          # Save raw log too
          with open('benchmark_results/waf_full.log','r') as f:
              results['raw_log'] = f.read()
          with open('benchmark_results/waf_results.json','w') as f:
              json.dump(results, f, indent=2, default=str)
          print('WAF Grade:', results.get('overall',{}).get('grade','N/A'))
          " 2>&1 | tee -a benchmark_results/waf_full.log

      # 7. Unit tests (capture everything)
      - name: Unit Tests
        run: |
          echo "=== UNIT TESTS ===" > benchmark_results/unit_full.log
          pip install pytest pytest-cov 2>&1 | tee -a benchmark_results/unit_full.log || true
          pytest tests/ -v --tb=long --cov=ironstack --cov-report=json --ignore=tests/test_attack/test_hooker.py --ignore=tests/test_attack/test_disassembler.py --ignore=tests/test_attack/test_emulator.py -m "not integration" 2>&1 | tee -a benchmark_results/unit_full.log || true

      # 8. Parse unit test results
      - name: Parse unit tests
        run: |
          python -c "
          import json, re
          from pathlib import Path
          result = {'passed':0,'failed':0,'errors':0,'coverage':0,'total':0,'raw_log':''}
          cov_file = Path('coverage.json')
          if cov_file.exists():
              with open(cov_file) as f:
                  cov = json.load(f)
                  result['coverage'] = round(cov.get('totals',{}).get('percent_covered',0),2)
          log_file = Path('benchmark_results/unit_full.log')
          if log_file.exists():
              text = log_file.read_text()
              result['raw_log'] = text
              m = re.search(r'(\d+) passed', text)
              if m: result['passed'] = int(m.group(1))
              m = re.search(r'(\d+) failed', text)
              if m: result['failed'] = int(m.group(1))
              m = re.search(r'(\d+) errors', text)
              if m: result['errors'] = int(m.group(1))
          result['total'] = result['passed'] + result['failed'] + result['errors']
          import time
          result['timestamp'] = time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())
          with open('benchmark_results/unit_results.json','w') as f:
              json.dump(result, f, indent=2)
          print(f'Tests: {result[\"passed\"]}/{result[\"total\"]} passed | Coverage: {result[\"coverage\"]}%')
          "

      # 9. Combine everything into a SINGLE JSON file
      - name: Combine into single report
        if: always()
        run: |
          python -c "
          import json
          from pathlib import Path
          from datetime import datetime

          final = {
              'timestamp': datetime.utcnow().isoformat(),
              'commit': '${{ github.sha }}',
              'branch': '${{ github.ref_name }}',
              'run_id': '${{ github.run_id }}',
              'run_url': '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              'structure_check': '',
              'install_log': '',
              'waf': {},
              'unit_tests': {},
              'overall_status': 'UNKNOWN'
          }

          # Structure check
          sc = Path('benchmark_results/structure_check.txt')
          if sc.exists():
              final['structure_check'] = sc.read_text()

          # Install log
          ilog = Path('benchmark_results/install_log.txt')
          if ilog.exists():
              final['install_log'] = ilog.read_text()

          # WAF results
          waf_json = Path('benchmark_results/waf_results.json')
          if waf_json.exists():
              with open(waf_json) as f:
                  final['waf'] = json.load(f)
          else:
              final['waf'] = {'error': 'No WAF results', 'raw_log': open('benchmark_results/waf_full.log').read() if Path('benchmark_results/waf_full.log').exists() else ''}

          # Unit test results
          ut_json = Path('benchmark_results/unit_results.json')
          if ut_json.exists():
              with open(ut_json) as f:
                  final['unit_tests'] = json.load(f)
          else:
              final['unit_tests'] = {'error': 'No unit test results', 'raw_log': open('benchmark_results/unit_full.log').read() if Path('benchmark_results/unit_full.log').exists() else ''}

          # Overall status
          waf_ok = final['waf'].get('overall',{}).get('grade') in ('A','B')
          tests_ok = final['unit_tests'].get('failed',0) == 0 and final['unit_tests'].get('total',0) > 0
          if waf_ok and tests_ok:
              final['overall_status'] = 'PASS'
          elif final['waf'] == {} and final['unit_tests'] == {}:
              final['overall_status'] = 'FAIL'
          else:
              final['overall_status'] = 'FAIL' if (not waf_ok or not tests_ok) else 'PASS'

          # Write the one and only file
          with open('benchmark_results/benchmark_report.json', 'w') as f:
              json.dump(final, f, indent=2, default=str)

          print('Overall status:', final['overall_status'])
          "

      # 10. Push the single report to main branch (ALWAYS)
      - name: Save report to main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmark_results/benchmark_report.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Benchmark report [skip ci]"
            git push origin main || echo "Push failed (may be PR)"
          fi

      # 11. Optional PR comment
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'benchmark_results/benchmark_report.json';
            if (!fs.existsSync(path)) return;
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const w = report.waf?.overall || {};
            const t = report.unit_tests || {};
            const body = `## 🛡️ IronStack Benchmark
            | Metric | Value |
            |--------|-------|
            | WAF Detection | ${w.detection_rate||'N/A'}% |
            | WAF Grade | ${w.grade||'N/A'} |
            | Performance | ${w.rps||'N/A'} req/s |
            | Tests | ${t.passed||0}/${t.total||0} |
            | Coverage | ${t.coverage||0}% |
            | **Overall** | **${report.overall_status}** |
            [📄 Full Report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/main/benchmark_results/benchmark_report.json)`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });